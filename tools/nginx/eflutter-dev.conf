server {
    listen 8188;
    listen [::]:8188;
    server_name localhost;
    root /var/www/eflutter-web;
    index index.html;

    access_log  /var/log/nginx/eflutter_dev_access.log;
    error_log   /var/log/nginx/eflutter_dev_error.log;

    location / {
        # Flutter web không gắn hash vào tên file: buộc Cloudflare/trình duyệt
        # hỏi lại server (ETag) để luôn nhận bản build mới nhất.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
